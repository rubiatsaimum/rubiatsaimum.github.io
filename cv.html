<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum Vitae | Rubiat Saimum</title>
  <meta name="description" content="Curriculum vitae of Rubiat Saimum, PhD student in Political Studies at Queen’s University.">
  <meta name="author" content="Rubiat Saimum">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://rubiatsaimum.com/cv.html">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>
    .cv-page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 48px 28px 72px;
    }
    .cv-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 24px;
    }
    .cv-toolbar h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 500;
    }
    .cv-document {
      display: grid;
      gap: 24px;
      justify-items: center;
    }
    .cv-page-canvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: 0 8px 28px rgba(0,0,0,.06);
    }
    .cv-status {
      padding: 4rem 1rem;
      text-align: center;
      color: var(--muted);
    }
    .cv-error {
      max-width: 680px;
      margin: 2rem auto;
      padding: 1rem 1.2rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
    }
    @media (max-width: 700px) {
      .cv-page { padding: 28px 18px 48px; }
      .cv-toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html" aria-label="Rubiat Saimum home"><img src="rs-monogram.png" alt="RS monogram logo"></a>
    <button class="menu-button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="nav" id="site-nav" aria-label="Primary navigation">
      <a href="index.html">About</a>
      <a href="research.html">Research</a>
      <a href="publications.html">Publications</a>
      <a href="teaching.html">Teaching</a>
      <a href="talks.html">Talks &amp; Media</a>
    </nav>
  </div>
</header>

<main id="main" class="cv-page">
  <div class="cv-toolbar">
    <h1>Curriculum Vitae</h1>
    <a class="button secondary" href="Rubiat_Saimum_CV.pdf" download>Download PDF</a>
  </div>

  <div id="cv-status" class="cv-status">Loading CV…</div>
  <div id="cv-document" class="cv-document" aria-label="Rubiat Saimum curriculum vitae"></div>
  <noscript><p class="cv-error">JavaScript is required to display the CV in the browser. Use the Download PDF button above instead.</p></noscript>
</main>

<script src="script.js"></script>
<script type="module">
  import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.min.mjs';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs';

  const pdfUrl = 'Rubiat_Saimum_CV.pdf';
  const container = document.getElementById('cv-document');
  const status = document.getElementById('cv-status');

  async function renderPdf() {
    try {
      const loadingTask = pdfjsLib.getDocument({
        url: pdfUrl,
        cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/cmaps/',
        cMapPacked: true,
        standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/standard_fonts/'
      });

      const pdf = await loadingTask.promise;
      status.textContent = `Loading ${pdf.numPages} pages…`;

      for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
        const page = await pdf.getPage(pageNumber);
        const baseViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.min(1040, Math.max(280, container.clientWidth));
        const scale = availableWidth / baseViewport.width;
        const viewport = page.getViewport({ scale });
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);

        const canvas = document.createElement('canvas');
        canvas.className = 'cv-page-canvas';
        canvas.setAttribute('aria-label', `CV page ${pageNumber}`);
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;

        container.appendChild(canvas);
        const context = canvas.getContext('2d', { alpha: false });

        await page.render({
          canvasContext: context,
          viewport,
          transform: outputScale === 1 ? null : [outputScale, 0, 0, outputScale, 0, 0]
        }).promise;
      }

      status.remove();
    } catch (error) {
      console.error(error);
      status.className = 'cv-error';
      status.innerHTML = 'The CV could not be displayed in the page. You can still use the <strong>Download PDF</strong> button above.';
    }
  }

  renderPdf();
</script>
</body>
</html>
